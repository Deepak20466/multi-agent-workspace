# Multi-Agent Workspace runtime configuration.
#
# Loaded/validated by src/config.py (AppConfig). `${VAR}` placeholders
# are expanded from the environment at load time (see .env.example),
# so secrets stay out of this file.

app:
  name: multi-agent-workspace
  version: "3.1"
  host: 0.0.0.0
  port: 8000

agents:
  enabled: [rag, sql, doc, web]
  router_model: claude-3-haiku-20240307
  rag_model: claude-3-5-sonnet-20240620
  max_iterations: 5
  memory: redis
  llm_backend: ollama          # anthropic | ollama
  ollama_model: qwen2.5:0.5b
  ollama_base_url: http://localhost:11434

resilience:
  max_retries: 5
  backoff: 1
  max: 10
  retry_on: [429, 503, 529]

retrieval:
  top_k: 10
  alpha: 0.5
  rrf_k: 60
  use_multi_query: true
  use_hyde: true
  use_rerank: true
  rerank_model: rerank-english-v3.0
  rerank_top_k: 5
  # Minimum rerank_score a candidate must clear to reach the LLM/citations,
  # applied after reranking (not before -- RRF's fused rank score doesn't
  # reflect direct query-document relevance the way the reranker's score
  # does). 0.0 matches the local ms-marco cross-encoder's natural
  # relevant/irrelevant decision boundary; retune if running the
  # Cohere/flashrank tiers, whose relevance scores use a different scale.
  rerank_score_threshold: 0.0
  # flashrank is installed and functional, but its relevance score is
  # normalized to ~0-1 (not the cross-encoder's raw logit scale) --
  # rerank_score_threshold above is calibrated against the cross-encoder
  # tier only. Flip this once the threshold has been recalibrated and
  # retested against flashrank's scale, or filtering will silently stop
  # working (an irrelevant flashrank score of ~0.00001 still clears a
  # >= 0.0 threshold).
  use_flashrank: false
  flashrank_model: ms-marco-MiniLM-L-12-v2

sql:
  database_url: ${DATABASE_URL}
  max_rows: 1000
  enable_charts: true
  allowed_tables: []
  ast_enforce_readonly: true
  check_ambiguity: true

doc_intelligence:
  enable_ocr: true
  ocr_lang: eng
  ocr_dpi: 300
  enable_tables: true
  enable_excel: true
  redact_pii: true

web:
  provider: tavily
  max_results: 3
  timeout_s: 10

mcp:
  enabled: true
  transport: stdio

tools:
  enable_calculator: true
  enable_python_repl: true
  enable_email: false
  timeout_s: 5

cache:
  enabled: true
  ttl: 3600

telemetry:
  enabled: true
  prometheus_port: 9090
