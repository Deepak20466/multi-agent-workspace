name: RAGAS Eval v3.1

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ragas-eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/ragdb
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: python -m pytest tests/ -v --cov=src

      - name: Seed SQL eval database
        run: python eval/seed_sql_db.py

      - name: Generate eval testsets (rag + sql + doc)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python eval/generate_testset.py --type all --sample-dir data/sample_documents --output-dir eval

      - name: Run RAG/SQL/doc evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python eval/run_ragas_eval.py --type all --output eval/results_v3.json

      - name: Check quality gates
        run: python eval/check_gates.py --results eval/results_v3.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results-v3
          path: |
            eval/testset.json
            eval/sql_testset.json
            eval/doc_testset.json
            eval/results_v3.json
