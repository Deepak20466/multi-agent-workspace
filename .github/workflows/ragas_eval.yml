name: RAGAS Evaluation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ragas-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: pytest tests/ -v --cov=src

      - name: Generate eval testset
        run: python eval/generate_testset.py --sample-dir data/sample_documents --output eval/testset.json

      - name: Run RAGAS evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python eval/run_ragas_eval.py --testset eval/testset.json --output eval/results.json

      - name: Check quality gates
        run: python eval/check_gates.py --results eval/results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: eval/results.json
